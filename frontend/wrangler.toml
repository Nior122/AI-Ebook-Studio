# Cloudflare configuration for the Next.js frontend.
#
# Uses @opennextjs/cloudflare (the official Next.js adapter for Cloudflare).
#
# Two ways to deploy:
#
# A) Cloudflare Pages (Git integration) — recommended:
#    1. In the Cloudflare dashboard: Workers & Pages -> Create -> Pages ->
#       Connect to Git -> pick this repo.
#    2. Framework preset: "Next.js"; build command: `npm run build`;
#       build output directory: `.open-next` (matches pages_build_output_dir).
#    3. Add the environment variables from .env.example (the NEXT_PUBLIC_*
#       ones) in Settings -> Environment variables.
#
# B) Workers deploy from your machine / CI:
#    cd frontend && npm run deploy
#    (requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID)
#
# Note: Clerk auth works on Cloudflare Pages; the middleware runs on the
# Workers runtime (see docs/Deployment_Guide.md for the required env vars).

name = "ai-ebook-studio"
compatibility_date = "2026-07-01"
pages_build_output_dir = ".open-next"

# Uncomment for a Workers-style deploy with a custom zone/route:
# workers_dev = true
